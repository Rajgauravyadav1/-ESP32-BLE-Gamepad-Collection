
<style>

  <circle cx="250" cy="200" r="4" fill="#993C1D"/>
  <circle cx="250" cy="230" r="4" fill="#993C1D"/>
  <circle cx="250" cy="260" r="4" fill="#993C1D"/>
  <circle cx="250" cy="290" r="4" fill="#993C1D"/>

  <!-- Right pin row labels -->

    <text class="th" x="100" y="201" text-anchor="middle" dominant-baseline="central">BTN A</text>
  </g>
  <!-- BTN B -->
  <g class="c-coral">
    <rect x="60" y="218" width="80" height="26" rx="5" stroke-width="0.5"/>

  <line x1="140" y1="231" x2="250" y2="230" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="140" y1="261" x2="250" y2="260" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="140" y1="291" x2="250" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="44" y1="201" x2="60" y2="201" stroke="#5F5E5A" stroke-width="1.5"/>

  <text class="ts" x="556" y="265" dominant-baseline="central">VCC</text>
  <text class="ts" x="556" y="282" dominant-baseline="central">VRX</text>

  <!-- Joy pin labels offset for VRY - need to go below box -->
  <text class="ts" x="556" y="270" dominant-baseline="central"></text>

  <!-- Joy pin dots on left edge of joystick box -->
  <circle cx="540" cy="248" r="4" fill="#5F5E5A"/>
  <circle cx="540" cy="264" r="4" fill="#378ADD"/>
  <circle cx="540" cy="280" r="4" fill="#0F6E56"/>

  <circle cx="595" cy="290" r="4" fill="#0F6E56"/>
  <text class="ts" x="610" y="310" dominant-baseline="central">VRY</text>

  <path d="M540 280 L510 280 L510 200 L430 200" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- VRY → GPIO35: comes from bottom of joy box -->
  <path d="M595 290 L595 320 L510 320 L510 230 L430 230" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Joy GND → ESP32 GND (right side pin 310) -->
  <path d="M540 248 L520 248 L520 310 L430 310" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <!-- Joy VCC → ESP32 3.3V (right side pin 340) -->
  <path d="M540 264 L525 264 L525 340 L430 340" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#ah)"/>

  <!-- Divider line between sections of ESP32 -->
  <line x1="258" y1="175" x2="422" y2="175" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">analog pins</text>
  <text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central">below</text>

  <!-- Note box -->
  <rect x="44" y="400" width="592" height="28" rx="5" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="414" text-anchor="middle" dominant-baseline="central">Buttons: one leg to GPIO, other leg to GND — INPUT_PULLUP active. Joystick VRX/VRY: 0–3.3V on input-only GPIO 34, 35</text>
</svg>
</div>
